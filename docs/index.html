<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>13U Announcements</title>
<meta name="description" content="Only the GroupMe announcements that matter to the 13U team.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
  :root {
    color-scheme: light dark;
    --navy: #15223d; --navy-2: #1f3057; --amber: #e0a422;
    --chalk: #f6f5f0; --paper: #ffffff; --ink: #1a1f2b; --ink-2: #5a6172; --line: #dcdad2;
    --hit-bg: #fbf1d8; --link: #1d4f8c;
    --display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
    --body: "Barlow", "Segoe UI", Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --navy: #0c1426; --navy-2: #172445; --amber: #f0b62f;
      --chalk: #12182a; --paper: #1b2237; --ink: #ecebe4; --ink-2: #a3a9b8; --line: #2c3650;
      --hit-bg: #3a2f14; --link: #8fb8f0;
    }
  }
  :root[data-theme="dark"] {
    --navy: #0c1426; --navy-2: #172445; --amber: #f0b62f;
    --chalk: #12182a; --paper: #1b2237; --ink: #ecebe4; --ink-2: #a3a9b8; --line: #2c3650;
    --hit-bg: #3a2f14; --link: #8fb8f0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--chalk); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  a { color: var(--link); word-break: break-all; }
  h1, h2 { font-family: var(--display); margin: 0; line-height: 1.05; }

  header { background: linear-gradient(135deg, var(--navy), var(--navy-2)); color: #fff; padding: 18px 16px 14px; border-bottom: 4px solid var(--amber); }
  header h1 { font-size: 30px; letter-spacing: .5px; }
  header .sub { color: #d9dce6; font-size: 13px; margin-top: 2px; }
  header .built { color: #b9bfd0; font-size: 12px; margin-top: 6px; }

  nav { display: flex; gap: 6px; padding: 10px 16px 0; max-width: 760px; margin: 0 auto; }
  nav button { font: 600 15px var(--display); letter-spacing: .4px; text-transform: uppercase; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); color: var(--ink-2); cursor: pointer; }
  nav button.on { background: var(--navy); color: #fff; border-color: var(--navy); }

  .tools { max-width: 760px; margin: 10px auto 0; padding: 0 16px; display: flex; gap: 8px; }
  .tools input { flex: 1; font: 15px var(--body); padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); }

  main { max-width: 760px; margin: 0 auto; padding: 12px 16px 40px; }
  .day { font-family: var(--display); font-size: 14px; letter-spacing: .6px; text-transform: uppercase; color: var(--ink-2); margin: 18px 0 6px; }
  .msg { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .msg.new { border-left: 4px solid var(--amber); }
  .meta { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); margin-bottom: 6px; }
  .meta img { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; background: var(--line); }
  .meta .who { font-weight: 600; color: var(--ink); }
  .meta .when { margin-left: auto; white-space: nowrap; }
  .text { white-space: pre-wrap; overflow-wrap: anywhere; }
  mark { background: var(--hit-bg); color: inherit; padding: 0 2px; border-radius: 3px; }
  .att img { display: block; max-width: 100%; border-radius: 8px; margin-top: 8px; }
  .why { font-size: 12px; color: var(--ink-2); margin-top: 8px; }
  .why span { background: var(--hit-bg); padding: 1px 7px; border-radius: 999px; }
  .empty { color: var(--ink-2); text-align: center; padding: 40px 0; }
  .note { font-size: 13px; color: var(--ink-2); margin: 8px 0 0; }
</style>
</head>
<body>
<header>
  <h1 id="title">13U Announcements</h1>
  <div class="sub" id="subtitle"></div>
  <div class="built" id="built"></div>
</header>
<nav>
  <button id="tab-kept" class="on">Kept</button>
  <button id="tab-skipped">Skipped</button>
</nav>
<div class="tools"><input id="q" type="search" placeholder="Search…"></div>
<main id="list"></main>

<script src="data.js"></script>
<script>
(function () {
  const D = window.DATA || { messages: [], skipped: [], keywords: [], senders: [] };
  const $ = (id) => document.getElementById(id);
  $("title").textContent = D.title || "13U Announcements";
  $("subtitle").textContent = D.subtitle || "";
  if (D.built) $("built").textContent = "Updated " + fmt(D.built * 1000, true);

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const kw = (D.keywords || []).filter(Boolean).map((k) => k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  const kwRe = kw.length ? new RegExp("\\b(" + kw.join("|") + ")\\b", "gi") : null;
  const urlRe = /(https?:\/\/[^\s<]+)/g;

  function fmt(ms, withDate) {
    const d = new Date(ms);
    const t = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    return withDate ? d.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" }) + " " + t : t;
  }
  function dayKey(ts) { return new Date(ts * 1000).toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" }); }
  function body(text) {
    let h = esc(text).replace(urlRe, (u) => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
    if (kwRe) h = h.replace(kwRe, "<mark>$1</mark>");
    return h;
  }

  let tab = "kept", seenKey = "13u_seen";
  let lastSeen = 0;
  try { lastSeen = Number(localStorage.getItem(seenKey) || 0); } catch (e) {}

  function render() {
    const q = $("q").value.trim().toLowerCase();
    const src = tab === "kept" ? D.messages : D.skipped;
    const items = src.filter((m) => !q || (m.text + " " + m.name).toLowerCase().includes(q));
    const list = $("list");
    if (!items.length) { list.innerHTML = `<div class="empty">${tab === "kept" ? "Nothing yet." : "Nothing skipped recently."}</div>`; return; }
    let html = "", day = "";
    if (tab === "skipped") html += `<p class="note">The last ${D.skipped.length} messages the filter did <b>not</b> keep. These named another age group. If one should have been kept, add a keyword or sender to config.json.</p>`;
    for (const m of items) {
      const k = dayKey(m.ts);
      if (k !== day) { day = k; html += `<div class="day">${esc(k)}</div>`; }
      const isNew = tab === "kept" && m.ts * 1000 > lastSeen;
      html += `<article class="msg${isNew ? " new" : ""}">
        <div class="meta">${m.avatar ? `<img src="${esc(m.avatar)}" alt="">` : ""}<span class="who">${esc(m.name)}</span><span class="when">${fmt(m.ts * 1000)}</span></div>
        <div class="text">${body(m.text)}</div>
        ${(m.attachments || []).map((u) => /\.(png|jpe?g|gif|webp)|groupme\.com/i.test(u) ? `<div class="att"><a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" loading="lazy" alt=""></a></div>` : `<div class="att"><a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a></div>`).join("")}
        ${m.reason ? `<div class="why"><span>${esc(m.reason)}</span></div>` : ""}
      </article>`;
    }
    list.innerHTML = html;
  }
  $("tab-kept").onclick = () => { tab = "kept"; $("tab-kept").classList.add("on"); $("tab-skipped").classList.remove("on"); render(); };
  $("tab-skipped").onclick = () => { tab = "skipped"; $("tab-skipped").classList.add("on"); $("tab-kept").classList.remove("on"); render(); };
  $("q").oninput = render;
  render();
  try { localStorage.setItem(seenKey, String(Date.now())); } catch (e) {}
})();
</script>
</body>
</html>
