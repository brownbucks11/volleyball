name: Fetch announcements and rebuild site

on:
  schedule:
    # Cron is UTC. Charlotte is UTC-5 (EST). GitHub drops a lot of frequent ticks; this is "about every 15 min".
    - cron: "*/15 * * * *"
  workflow_dispatch:            # Actions tab -> "Run workflow"
    inputs:
      backfill:
        description: "Messages to scan on a group's first run"
        default: "50"
      rescan:
        description: "Forget cursors and re-apply the rules to the last <backfill> messages"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: America/New_York
      GROUPME_TOKEN: ${{ secrets.GROUPME_TOKEN }}
      GROUPME_BOT_ID: ${{ secrets.GROUPME_BOT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch, rebuild, commit if changed
        run: |
          python fetch.py --backfill "${{ inputs.backfill || '50' }}" ${{ inputs.rescan == true && '--rescan' || '' }}
          python build_site.py
          git config user.name "announce-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs/data.js
          # ignore a change to nothing but the "built" timestamp
          REAL=$(git diff --cached -U0 -- . ':!docs/data.js' | grep -E '^[+-][^+-]' | wc -l)
          if [ "$REAL" = "0" ]; then
            echo "no new messages"; git reset -q
          else
            git commit -q -m "Announcements $(date '+%a %b %d %I:%M %p %Z')"
            git pull --rebase -q -X theirs || { git rebase --abort 2>/dev/null || true; git fetch -q origin && git reset -q --hard origin/main; }
            git push -q && echo "pushed" || echo "push failed (next tick retries)"
          fi
